<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRO ADMINISTRADORES - SONIC DELIVERY</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg mx-auto" style="max-width: 650px; width: 100%;">
      <div class="row g-0 align-items-center">
        
        <!-- Logo -->
        <div class="col-md-5 text-center p-3">
          <img src="../imagenes/sonic logo.jpeg" class="img-fluid" alt="Logo Sonic Delivery">
        </div>

        <!-- Formulario -->
        <div class="col-md-7">
          <div class="card-body">
            <h4 class="card-title">REGISTRO ADMINISTRADOR</h4>

            <div class="formulario">
              <form action="../PHP/administradorPHP/registroAdmin.php" method="POST">

                <div class="mb-3">
                  <label for="nombre_administrador" class="form-label">NOMBRE ADMINISTRADOR</label>
                  <input type="text" class="form-control" id="nombre_administrador" name="nombre_administrador"
                    placeholder="En este campo solo letras" required>
                </div>

                <div class="mb-3">
                  <label for="cedula_administrador" class="form-label">CÉDULA ADMINISTRADOR</label>
                  <input type="number" class="form-control" id="cedula_administrador" name="cedula_administrador"
                    placeholder="En este campo solo números" required>
                </div>

                <div class="mb-3">
                  <label for="contraseña_administrador" class="form-label">CONTRASEÑA ADMINISTRADOR</label>
                  <input type="password" class="form-control" id="contraseña_administrador" name="contraseña_administrador"
                    placeholder="Números, letras y caracteres especiales" required>
                </div>

                <div class="mb-3">
                  <label for="telefono_administrador" class="form-label">TELÉFONO ADMINISTRADOR</label>
                  <input type="number" class="form-control" id="telefono_administrador" name="telefono_administrador"
                    placeholder="Solo números" required>
                </div>

                <div class="d-grid gap-2 mt-4">
                  <button type="submit" id="guardar" class="btn btn-primary">REGISTRAR</button>
                  <a href="PanelAdmin.html" class="btn btn-secondary">VOLVER</a>
                </div>

              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
