<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIO DE SESIÓN - SONIC DELIVERY</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card mb-3 shadow-lg" style="max-width: 600px; width: 100%; border-radius: 15px;">
            <div class="row g-0 align-items-center">
                <div class="col-md-4 text-center p-3">
                    <img src="imagenes/sonic logo.jpeg" class="img-fluid rounded-start" alt="Logo Sonic Delivery">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4" style="font-weight: bold;">🌐 SONIC DELIVERY 🌐</h4>

                        <div class="formulario">
                            <form id="formPrincipal">

                                <!-- MENÚ DESPLEGABLE PARA ESCOGER VISTA / OPCIÓN -->
                                <div class="mb-3">
                                    <label for="rolSelect" class="form-label fw-bold">Selecciona tu rol de acceso:</label>
                                    <select class="form-select" id="rolSelect" required>
                                        <option value="" selected disabled>-- Selecciona una opción --</option>
                                        <option value="comercio">Comercio</option>
                                        <option value="repartidor">Repartidor</option>
                                        <option value="administrador">Administrador</option>
                                    </select>
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button type="button" id="btnContinuar" class="btn btn-primary">CONTINUAR</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/iniciosesion.js"></script>

</body>

</html>
