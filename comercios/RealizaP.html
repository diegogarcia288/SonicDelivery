  <div class="main-content container-fluid px-3 my-3 d-flex justify-content-center align-items-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-lg p-4 rounded-3 border-custom" style="background-color: rgb(39, 132, 186); color: white; border: 4px solid rgb(18, 79, 114) !important;">

        <form action="../PHP/comercioPHP/registroPedido.php" method="post" id="formRealizarPedido">

            <label for="Detalles" class="form-label fw-bold text-white">Detalles</label>
            <input type="text" class="form-control shadow-sm" id="Detalles" name="Detalles" placeholder="Opcional llenar">

            <input type="text" class="form-control shadow-sm" id="Direccion" name="Direccion">
          </div>

          <div class="mb-3">
            <label for="Comercio" class="form-label fw-bold text-white">Comercio</label>
            <input type="text" class="form-control shadow-sm bg-light" id="Comercio" name="Comercio" readonly>
          </div>

          <button type="submit" id="guardar" class="btn btn-dark w-100 mt-3 fw-bold text-uppercase py-2 shadow-sm" style="background-color: rgb(18, 79, 114); border: none;">
