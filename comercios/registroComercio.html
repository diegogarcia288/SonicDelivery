<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO COMERCIOS-SONIC DELIVERY</title>
      <link rel="stylesheet" href="../css/registro.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="../imagenes/sonic logo.jpeg" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">REGISTRO COMERCIO</h5>

        <div class="formulario">
          <form action="" method="post">
            <div class="name">
              <input type="text" id="nombre_comercio" name="nombre">
              <label>USUARIO COMERCIO</label>
            </div>

            <div class="nit">
              <input type="number" id="nit_comercio" name="nit">
              <label>NIT COMERCIO</label>
            </div>

            <div class="contrasena">
              <input type="password" id="contrasena_comercio" name="contraseña">
              <label>CONTRASEÑA COMERCIO</label>
            </div>

            <div class="direccion">
              <input type="text" id="direccion_comercio" name="direccion">
              <label>DIRECCIÓN COMERCIO</label>
            </div>

            <div class="correo">
              <input type="email" id="correo_comercio" name="correo">
              <label>CORREO ELECTRÓNICO</label>
            </div>

            ¿YA TIENES CUENTA? <a href="inicioComercio.html">INGRESA AQUÍ</a>

            <div class="rein">
              <button type="submit" id="guardar" class="btn btn-primary" value="Registrar">REGISTRAR</button>
            </div>

            <div class="rein">
              <a href="../PanelAdmin.html" class="btn btn-primary">VOLVER</a>
            </div>

          </form>

      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/registro_comercios.js"></script>

</body>
</html>
