<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐Sonic Delivery🌐</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/principal.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FUENTE DE LETRA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Creepster&family=Libertinus+Keyboard&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <style>
        /* Estructura de pantalla completa sin márgenes externos */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 0rem;
            padding-bottom: 1rem;
        }

        /* Altura controlada para el scroll interno de la tabla */
        .table-scroll-container {
            max-height: 52vh;
            overflow-y: auto;
        }

        /* El footer se acopla perfectamente abajo de la pantalla */
        footer {
            flex-shrink: 0;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<!-- MENÚ DE NAVEGACIÓN -->
<nav class="navbar navbar-expand-lg navbar-custom flex-shrink-0">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🌐SONIC DELIVERY🌐</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="PedidosDD.html">Pedidos Disponibles</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="PedidosTomados.html">Pedidos Tomados</a>
                </li>
            </ul>

            <!-- Aquí se pintará automáticamente el rol y nombre del repartidor -->
            <span id="infoSesion" class="navbar-text text-white fw-bold me-3"></span>

            <!-- Botón de Cerrar Sesión alineado a la derecha -->
            <button id="btnCerrarSesion" class="btn btn-outline-danger" type="button">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<!-- TÍTULO H1 DE EXTREMO A EXTREMO CON ESPACIADO SIMÉTRICO -->
<h1 class="mt-3 mb-3 py-2 fs-3 w-100 text-center">Pedidos Tomados</h1>

<!-- VISTA PEDIDOS -->
<div class="main-content container-fluid px-4">
    <div class="card shadow p-3 bg-white flex-fill d-flex flex-column overflow-hidden">
        <h4 class="mb-3 flex-shrink-0">Lista de Pedidos Tomados</h4>

        <!-- Contenedor dinámico con scroll interno estricto -->
        <div class="table-scroll-container table-responsive flex-fill">
            <div id="lista-pedidos">
                <p class="text-muted">Cargando pedidos tomados...</p>
            </div>
        </div>
    </div>
</div>

<footer>
    <nav class="navbar navbar-expand-lg navbar-custom m-0 py-1">
        <div class="container-fluid">
            <a class="navbar-brand fs-6" href="#">🌐SONIC DELIVERY🌐</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#footerNav" aria-controls="footerNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="footerNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item d-flex gap-2">
                        <button class="btn btn-primary btn-sm" type="button"
                            onclick="cambiarDisponibilidad('activo')">Activarse</button>
                        <button class="btn btn-primary btn-sm" type="button"
                            onclick="cambiarDisponibilidad('desactivo')">Desactivarse</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/pedidosTomados.js" defer></script>
<script src="../js/sesionNavbar.js" defer></script>

</body>

</html>
