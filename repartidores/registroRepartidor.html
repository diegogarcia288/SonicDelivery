<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRO REPARTIDORES-SONIC DELIVERY</title>
  <link rel="stylesheet" href="../css/registro.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <div class="card mb-3" style="max-width: 540px;">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="../imagenes/sonic logo.jpeg" class="img-fluid rounded-start" alt="...">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">REGISTRO REPARTIDOR</h5>

          <div class="formulario">
            <form action="../PHP/registroRepartidor.php" method="POST">

              <div class="name">
                <input type="text" id="nombre_repartidor" name="nombre_repartidor" placeholder="Nombre completo">
                <label>NOMBRE REPARTIDOR</label>
              </div>

              <div class="name">
                <input type="number" id="cedula_repartidor" name="cedula_repartidor"
                  placeholder="Cédula del repartidor">
                <label>CÉDULA REPARTIDOR</label>
              </div>

              <div class="contrasena">
                <input type="password" id="contrasena_repartidor" name="contrasena_repartidor" placeholder="Contraseña">
                <label>CONTRASEÑA</label>
              </div>

              <div class="telefono">
                <input type="number" id="telefono_repartidor" name="telefono_repartidor" placeholder="Teléfono">
                <label>TELÉFONO</label>
              </div>

              <div class="name">
                <input type="number" id="cedula_admin" name="cedula_admin" placeholder="Cédula del Administrador">
                <label>CÉDULA ADMIN QUE LO REGISTRA</label>
              </div>

              <div class="rein">
                <button type="submit" id="guardar" class="btn btn-primary">REGISTRAR</button>
              </div>

              <div class="rein">
                <a href="../PanelAdmin.html" class="btn btn-primary">VOLVER</a>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/registro_repartidores.js"></script>


</body>

</html>
